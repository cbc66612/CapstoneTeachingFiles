<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="https://glitch.com/favicon.ico" />
   

    <title>Fortune Teller</title>

    <!-- import the webpage's stylesheet -->
    <link rel="stylesheet" href="style.css" />
  </head>
  
  <body>
    <img src="ball.jpg" alt="Fortune Ball" width="300" height="300"> 
    <!-- this is the start of content -->
    <h1>
      Fortune Teller
    </h1>

    <form name="fortuneTeller" id="fortuneTeller" action="fortune.html">
      <label for="namefield">Name:</label>
      <input type="text" id="namefield" name="name" placeholder="your name" required>
      <br>
      <label for="questionfield">Question:</label>
      <input type="text" id="questionfield" name="question" placeholder="a yes or no question">
      <br>
      <label for="datefield">Date:</label>
      <input type="date" id="datefield" name="date">
      <br>
      <label for="food">Favorite Food:</label>
     <select name="food" id="food">
        <option value="pizza">Pizza</option>
        <option value="burgers">Burgers</option>
        <option value="pasta">Pasta</option>
      </select>
      <br>
      <label for="emailfield">Email:</label>
      <input type="email" id="emailfield" name="email" placeholder="your email">
      <br>
      <label for="radio">Are you worried? :</label>
      <input type="radio" id="yes" name="answer" value="yes">
      <label for="yes">Yes</label>
      <input type="radio" id="no" name="answer" value="no">
      <label for="no">No</label>
      <br>
      <br>
      <label for="message">How do you feel:</label>
      <textarea name="message" id="message" placeholder="Any additional information?"></textarea>
      <br>


    
      <input type="submit">
    
    </form>
    <div id="fortune"></div>
  </body>
</html>
